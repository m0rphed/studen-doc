[project]
name = "studen-doc"
version = "0.1.0"
description = "Декларативная генерация отчётов .docx по ГОСТ 7.32-2017 и стилям вузов (ГУАП): формулы LaTeX, подписи, листинги, перекрёстные ссылки"
readme = "README.md"
authors = [
    { name = "Vic Khov", email = "victorkhovtko@gmail.com" }
]
keywords = ["docx", "gost", "gost-7-32", "report", "latex", "omml", "suai", "bibliography", "csl"]
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.3",
    "pypandoc-binary>=1.17",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
highlight = [
    "pygments>=2.21.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "lxml-stubs>=0.5.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-pygments>=2.21.0.20260819",
]
examples = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "polars>=2.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[tool.uv]
default-groups = ["dev", "examples"]    # примеры с numpy, pandas, matplotlib запускаются обычным ``uv run``

[tool.ruff]
line-length = 120
extend-exclude = [
    "examples/listings",                           # код-образцы для листингов: показываются в отчете, не проверяются
    "src/studen_doc/style/changes.py",       # сгенерировано tools/generate_style_changes.py
]
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "TID", "PLR1714", "C4", "ANN001", "ANN201", "ANN202"]
ignore = ["RUF001", "RUF002", "RUF003"]   # кириллица в строках и комментариях — норма

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"             # везде абсолютные импорты: studen_doc....

[tool.ruff.lint.isort]
known-first-party = ["studen_doc"]

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "examples", "tools"]

[tool.ruff.lint.per-file-ignores]
# Значения по умолчанию в стилях — frozen dataclass-ы: они неизменяемы, делить один экземпляр безопасно.
"src/studen_doc/style/*.py" = ["RUF009"]
"examples/*.py" = ["E501", "ANN"]   # длинные строки LaTeX
"tests/*.py" = ["ANN"]   # в тестах типы не обязательны
